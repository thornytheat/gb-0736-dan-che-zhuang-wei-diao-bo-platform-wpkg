<div class="stage" id="stage-bulletin" hidden>
  <section class="panel">
    <div class="panel__head"><div><h2>站点确认与截止</h2><span class="subtle" id="bulletin-state"></span></div>
      <form id="cutoff-form" class="inline-form"><label for="bulletin-asof">统一截止</label><input id="bulletin-asof" type="datetime-local" step="any" required><button class="btn" type="submit">重算草稿</button></form>
    </div>
    <div class="ledger-scroll" id="bulletin-stations"></div>
    <div class="panel__body actions form-actions">
      <button class="btn" id="publish-partial" type="button">发布已确认站结论</button>
      <button class="btn btn--primary" id="publish-all" type="button">全站对齐后切换</button>
      <button class="btn" id="verify-bulletin" type="button">再次核对当前公报</button>
      <a class="btn" id="bulletin-evidence" aria-disabled="true">下载公报证据</a>
    </div>
  </section>
  <section class="panel">
    <div class="panel__head"><div><h2>补传批次</h2><span class="subtle" id="backfill-summary"></span></div><button class="btn" id="sample-backfill" type="button">载入下一批样例补传</button></div>
    <div class="ledger-scroll" id="backfill-rows"></div>
    <form class="panel__body inline-form" id="backfill-form">
      <label for="batch-id">批次号</label><input id="batch-id" name="batch_id" pattern="[A-Za-z0-9_-]{1,32}" required>
      <label for="batch-station">站点</label><select id="batch-station" name="station"></select>
      <label for="batch-covered">覆盖至</label><input id="batch-covered" name="covered_until" type="datetime-local" step="any" required>
      <label for="batch-file">事件表</label><input id="batch-file" name="events" type="file" accept=".csv,text/csv" required>
      <button class="btn btn--primary" type="submit">收件补传</button>
    </form>
  </section>
  <section class="panel">
    <div class="panel__head"><h2>补传引起的结论变化</h2><span class="subtle" id="bulletin-diff-state"></span></div>
    <div id="bulletin-compare" class="panel__body diff-grid"></div>
    <div class="ledger-scroll" id="bulletin-attempts"></div>
  </section>
  <section class="panel">
    <div class="panel__head"><h2>公报历史</h2><span class="subtle" id="bulletin-history-state"></span></div>
    <div class="ledger-scroll" id="bulletin-history"></div>
  </section>
</div>
